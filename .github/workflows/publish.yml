name: Publish

# Fires when release-please merges a release PR and publishes a GitHub Release.
# Two jobs run in parallel:
#   1. publish-npm      — publishes @melorx/client to npmjs.com with provenance.
#   2. publish-docker   — builds and pushes the versioned image to GHCR.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. client-v0.3.0 or melorx-v0.3.0)
        required: true

concurrency:
  group: publish-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  select:
    name: Route tag
    runs-on: ubuntu-latest
    outputs:
      is_client: ${{ steps.parse.outputs.is_client }}
      is_app: ${{ steps.parse.outputs.is_app }}
      version: ${{ steps.parse.outputs.version }}
      npm_dist_tag: ${{ steps.parse.outputs.npm_dist_tag }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          echo "tag=$TAG"
          is_client=false
          is_app=false
          version=""
          dist_tag="latest"

          if [[ "$TAG" =~ ^client-v([0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?)$ ]]; then
            is_client=true
            version="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^melorx-v([0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?)$ ]]; then
            is_app=true
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::Unrecognised release tag format: $TAG (expected client-vX.Y.Z or melorx-vX.Y.Z)"
            exit 1
          fi

          # Pre-release versions ship under the `next` dist-tag; stable goes to `latest`.
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          fi

          echo "is_client=$is_client"          >> "$GITHUB_OUTPUT"
          echo "is_app=$is_app"                >> "$GITHUB_OUTPUT"
          echo "version=$version"              >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$dist_tag"        >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish @melorx/client to npm
    needs: select
    if: needs.select.outputs.is_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @melorx/client build

      - name: Verify package version matches tag
        working-directory: packages/client
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "${{ needs.select.outputs.version }}" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag (${{ needs.select.outputs.version }})"
            exit 1
          fi

      - name: Publish
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public --tag ${{ needs.select.outputs.npm_dist_tag }}

      - name: Summarise
        run: |
          echo "## npm publish" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`@melorx/client@${{ needs.select.outputs.version }}\` under dist-tag \`${{ needs.select.outputs.npm_dist_tag }}\`." >> "$GITHUB_STEP_SUMMARY"

  publish-docker:
    name: Build & push versioned Docker image
    needs: select
    if: needs.select.outputs.is_app == 'true'
    uses: ./.github/workflows/_reusable-docker-build.yml
    with:
      push: true
      tags: |
        ghcr.io/${{ github.repository_owner }}/melorx:v${{ needs.select.outputs.version }}
        ghcr.io/${{ github.repository_owner }}/melorx:${{ needs.select.outputs.npm_dist_tag }}
        ghcr.io/${{ github.repository_owner }}/melorx:sha-${{ github.sha }}
