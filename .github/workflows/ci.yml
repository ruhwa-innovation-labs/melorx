name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://melo:melo@localhost:5432/melorx_test
  NODE_ENV: test
  LOG_LEVEL: warn

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: melo
          POSTGRES_PASSWORD: melo
          POSTGRES_DB: melorx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed ONCHigh curated pairs
        run: pnpm db:seed

      - name: Seed CI fixture (brand + NDC + class rule slice)
        # Provides the tiny slice of RxNorm-derived data API integration tests
        # need without shipping the 1.2 GB RxNorm RRF files to CI.
        run: pnpm db:seed:ci

      - name: Run all tests
        run: pnpm -r test

      - name: Build @melorx/client (sanity check publish output)
        run: pnpm --filter @melorx/client build

      - name: Assert DTS has no external @melorx/core imports
        run: |
          if grep -q "from '@melorx/core'" packages/client/dist/index.d.ts; then
            echo "ERROR: @melorx/client DTS leaks @melorx/core import — types must be inlined." >&2
            exit 1
          fi
