name: Validate community contributions

on:
  pull_request:
    paths:
      - 'pipeline/sources/community/**'
      - '.github/workflows/validate-community.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck pipeline
        run: pnpm --filter @melorx/pipeline typecheck

      - name: Run community validator
        run: pnpm --filter @melorx/pipeline validate:community

      - name: Run pipeline unit tests
        run: pnpm --filter @melorx/pipeline test
